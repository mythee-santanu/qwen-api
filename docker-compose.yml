services:
  api:
    build: .
    container_name: qwen-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Keep FastAPI lightweight.
    # Ollama/Qwen is running separately.
    cpus: "1.0"
    mem_limit: 500m

    ports:
      - "8002:8000"

    env_file:
      - .env

    environment:
      TZ: Asia/Kolkata

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"

  postgres:
    image: postgres:16-alpine
    container_name: qwen-postgres
    restart: unless-stopped

    # PostgreSQL is internal only.
    cpus: "0.5"
    mem_limit: 512m

    shm_size: 128m

    environment:
      TZ: Asia/Kolkata

      POSTGRES_DB: qwen_api
      POSTGRES_USER: qwen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=128MB
      - -c
      - random_page_cost=1.1

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # IMPORTANT:
    # No "ports" here.
    #
    # PostgreSQL is NOT exposed to the internet.
    # FastAPI connects internally using:
    #
    # postgres:5432

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U qwen -d qwen_api

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
